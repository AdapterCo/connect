version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: whatsapp-crm-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_DB: adapterconnect
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: whatsapp-crm-ai
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./auth_info_baileys:/app/auth_info_baileys
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?Configure DATABASE_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Configure ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET:?Configure JWT_SECRET}
    depends_on:
      - db

volumes:
  pgdata:
